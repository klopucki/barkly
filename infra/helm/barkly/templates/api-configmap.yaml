apiVersion: v1
kind: ConfigMap

metadata:
  name: barkly-api-config

data:
  SPRING_DATASOURCE_URL: {{ .Values.api.datasource.url | quote }}
{{- if .Values.api.metrics.enabled }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,prometheus"
{{- end }}
  BARKLY_S3_ENDPOINT: {{ .Values.api.objectStorage.endpoint | quote }}
  BARKLY_S3_REGION: {{ .Values.api.objectStorage.region | quote }}
  BARKLY_S3_BUCKET: {{ .Values.api.objectStorage.bucket | quote }}
  BARKLY_S3_PATH_STYLE: {{ .Values.api.objectStorage.pathStyle | quote }}
