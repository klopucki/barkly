{{- if and .Values.ingress.enabled .Values.ingress.httpsOnly }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: barkly-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: barkly-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-barkly-https@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: barkly-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
