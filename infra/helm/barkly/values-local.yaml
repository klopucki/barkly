# Single-node development only; do not use these database credentials in production.
api:
  image:
    tag: monitoring-dev
  replicas: 1
  autoscaling:
    enabled: false
  metrics:
    enabled: true
  objectStorage:
    endpoint: http://barkly-silo:9000
    pathStyle: true
    credentialsSecret: barkly-s3-credentials
web:
  image:
    tag: monitoring-dev
  replicas: 1

ingress:
  host: localhost
