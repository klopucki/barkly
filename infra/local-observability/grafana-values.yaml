service:
  type: ClusterIP
persistence:
  enabled: true
  size: 1Gi
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://barkly-prometheus-server.monitoring.svc.cluster.local
        uid: barkly-prometheus
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://barkly-loki.monitoring.svc.cluster.local:3100
        uid: barkly-loki
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Barkly
        type: file
        editable: false
        options:
          path: /var/lib/grafana/dashboards/default
dashboards:
  default:
    barkly:
      json: |
        {
          "uid": "barkly-local",
          "title": "Barkly \u2014 local overview",
          "schemaVersion": 39,
          "refresh": "30s",
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "panels": [
            {
              "id": 1,
              "title": "API availability",
              "type": "stat",
              "datasource": {
                "type": "prometheus",
                "uid": "barkly-prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "up{job=\"barkly-api\"}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              }
            },
            {
              "id": 2,
              "title": "JVM heap in use",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "barkly-prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(jvm_memory_used_bytes{job=\"barkly-api\",area=\"heap\"})"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes"
                },
                "overrides": []
              }
            },
            {
              "id": 3,
              "title": "HTTP requests per second",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "barkly-prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 8
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(http_server_requests_seconds_count{job=\"barkly-api\"}[5m]))"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                },
                "overrides": []
              }
            },
            {
              "id": 4,
              "title": "HTTP 5xx responses per second",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "barkly-prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 8
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(rate(http_server_requests_seconds_count{job=\"barkly-api\",status=~\"5..\"}[5m]))"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps"
                },
                "overrides": []
              }
            },
            {
              "id": 5,
              "title": "Node CPU utilisation",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "barkly-prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 16
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percent"
                },
                "overrides": []
              }
            },
            {
              "id": 6,
              "title": "Node memory used",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "barkly-prometheus"
              },
              "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 16
              },
              "targets": [
                {
                  "refId": "A",
                  "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes"
                },
                "overrides": []
              }
            },
            {
              "id": 7,
              "title": "Node disk space used",
              "type": "timeseries",
              "datasource": {"type": "prometheus", "uid": "barkly-prometheus"},
              "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
              "targets": [{"refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay|squashfs\"})"}],
              "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []}
            },
            {
              "id": 8,
              "title": "Node disk read/write throughput",
              "type": "timeseries",
              "datasource": {"type": "prometheus", "uid": "barkly-prometheus"},
              "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
              "targets": [
                {"refId": "A", "expr": "sum by (device) (rate(node_disk_read_bytes_total{device!~\"loop.*|ram.*\"}[5m]))", "legendFormat": "read {{device}}"},
                {"refId": "B", "expr": "sum by (device) (rate(node_disk_written_bytes_total{device!~\"loop.*|ram.*\"}[5m]))", "legendFormat": "write {{device}}"}
              ],
              "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
            },
            {
              "id": 9,
              "title": "Node network receive/transmit",
              "type": "timeseries",
              "datasource": {"type": "prometheus", "uid": "barkly-prometheus"},
              "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
              "targets": [
                {"refId": "A", "expr": "sum by (device) (rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m]))", "legendFormat": "receive {{device}}"},
                {"refId": "B", "expr": "sum by (device) (rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m]))", "legendFormat": "transmit {{device}}"}
              ],
              "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
            },
            {
              "id": 10,
              "title": "PostgreSQL container CPU and memory",
              "type": "timeseries",
              "datasource": {"type": "prometheus", "uid": "barkly-prometheus"},
              "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
              "targets": [
                {"refId": "A", "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"barkly\",pod=~\"barkly-postgres-.*\",container!=\"\"}[5m]))", "legendFormat": "CPU cores"},
                {"refId": "B", "expr": "sum(container_memory_working_set_bytes{namespace=\"barkly\",pod=~\"barkly-postgres-.*\",container!=\"\"})", "legendFormat": "memory"}
              ],
              "fieldConfig": {"defaults": {"unit": "short"}, "overrides": [{"matcher": {"id": "byName", "options": "memory"}, "properties": [{"id": "unit", "value": "bytes"}]}]}
            },
            {
              "id": 11,
              "title": "Recent Barkly application logs",
              "type": "logs",
              "datasource": {"type": "loki", "uid": "barkly-loki"},
              "gridPos": {"h": 12, "w": 24, "x": 0, "y": 40},
              "targets": [{"refId": "A", "expr": "{namespace=\"barkly\"}"}],
              "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "sortOrder": "Descending", "dedupStrategy": "none"}
            }
          ]
        }
