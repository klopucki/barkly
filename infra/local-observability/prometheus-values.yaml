server:
  retention: 7d
  persistentVolume:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
extraScrapeConfigs: |
  - job_name: barkly-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['barkly-api.barkly.svc.cluster.local:8080']
