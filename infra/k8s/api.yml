apiVersion: apps/v1
kind: Deployment
metadata:
  name: barkly-api
  namespace: barkly
spec:
  replicas: 3
  selector:
    matchLabels:
      app: barkly-api
  template:
    metadata:
      labels:
        app: barkly-api
    spec:
      containers:
      - name: api
        image: barkly-api:local
        envFrom:
        - configMapRef:
            name: barkly-api-config
        - secretRef:
            name: barkly-api-secret
---
apiVersion: v1
kind: Service
metadata:
  name: barkly-api
  namespace: barkly
spec:
  selector:
    app: barkly-api
  ports:
  - port: 8080
    targetPort: 8080
