apiVersion: apps/v1
kind: Deployment
metadata:
  name: barkly-web
  namespace: barkly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barkly-web
  template:
    metadata:
      labels:
        app: barkly-web
    spec:
      containers:
      - name: web
        image: barkly-web:local

      resources:
        requests:
          cpu: 50m
          memory: 64Mi

        limits:
          cpu: 200m
          memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: barkly-web
  namespace: barkly
spec:
  selector:
    app: barkly-web
  ports:
  - port: 80
    targetPort: 80
