apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: barkly-postgres-pvc
  namespace: barkly

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: barkly-postgres
  namespace: barkly

spec:
  serviceName: barkly-postgres
  replicas: 1

  selector:
    matchLabels:
      app: barkly-postgres

  template:
    metadata:
      labels:
        app: barkly-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:18

          env:
            - name: POSTGRES_DB
              value: barkly
            - name: POSTGRES_USER
              value: barkly
            - name: POSTGRES_PASSWORD
              value: barkly

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U barkly -d barkly
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: barkly-postgres-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: barkly-postgres
  namespace: barkly

spec:
  selector:
    app: barkly-postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP