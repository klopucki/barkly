server:
  retention: 3d
  persistentVolume:
    enabled: true
    size: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: true
prometheus-node-exporter:
  enabled: true
extraScrapeConfigs: "- job_name: barkly-api\n  metrics_path: /actuator/prometheus\n\
  \  static_configs:\n    - targets: ['barkly-api.barkly.svc.cluster.local:8080']\n"
