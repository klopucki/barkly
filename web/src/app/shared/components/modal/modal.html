<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-stone-950/50 p-4 backdrop-blur-sm"
>
  <div
    class="max-h-[calc(100vh-2rem)] w-full max-w-xl overflow-y-auto rounded-2xl border border-stone-200 bg-white p-6 shadow-2xl"
  >
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-2xl font-semibold tracking-tight">{{ title() }}</h2>

      <button
        type="button"
        class="rounded-lg px-2 py-1 text-stone-500 hover:bg-stone-100"
        (click)="close()"
      >
        ✕
      </button>
    </div>

    <ng-content />
  </div>
</div>
